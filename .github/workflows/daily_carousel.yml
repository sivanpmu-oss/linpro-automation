name: Daily Linpro Carousel Publisher

on:
  schedule:
    - cron: '0,20,40 19-23 * * *'
    - cron: '0,20,40 0-4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run carousel publisher
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/carousel_publisher.py
      - name: Commit published log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain carousels_published_log.json)" ]; then
            git pull --rebase origin main || true
            git add carousels_published_log.json
            git commit -m "Carousel published $(TZ='Asia/Jerusalem' date +%Y-%m-%d)"
            git push
          fi
